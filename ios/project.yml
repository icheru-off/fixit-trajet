name: FixitTrajet
options:
  bundleIdPrefix: fr.fixit-service
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  FixitTrajet:
    type: application
    platform: iOS
    sources:
      - FixitTrajet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.fixit-service.trajet
        PRODUCT_NAME: FixitTrajet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "NO"
    info:
      path: FixitTrajet/Info.plist
      properties:
        CFBundleDisplayName: FixIT Trajet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "FixIT Trajet partage votre position avec le client uniquement pendant le trajet vers son domicile, pour lui indiquer votre heure d'arrivée."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Autorisez « Toujours » pour que le suivi continue écran verrouillé pendant vos trajets. La position n'est jamais envoyée en dehors d'un trajet démarré."
        CFBundleURLTypes:
          - CFBundleURLName: fr.fixit-service.trajet
            CFBundleURLSchemes:
              - fixittrajet
        LSApplicationQueriesSchemes:
          - waze
          - comgooglemaps
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
